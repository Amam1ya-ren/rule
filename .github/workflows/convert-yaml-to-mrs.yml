name: Convert YAML rules to MRS

permissions:
  contents: write

# 新 push 会取消旧的运行，避免排队等待
concurrency:
  group: rules-convert
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "rules/*.yaml"

env:
  # 固定 mihomo 版本，避免 API + cache 失效
  MIHOMO_VERSION: v1.19.0

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout（只取必要历史）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2️⃣ 缓存 mihomo 二进制
      - name: Cache mihomo binary
        id: cache-mihomo
        uses: actions/cache@v4
        with:
          path: mihomo
          key: mihomo-${{ runner.os }}-${{ env.MIHOMO_VERSION }}

      # 3️⃣ 下载 mihomo（仅 cache miss）
      - name: Download mihomo
        if: steps.cache-mihomo.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "📦 Downloading mihomo $MIHOMO_VERSION"
          wget -q https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz
          gunzip mihomo-linux-amd64-${MIHOMO_VERSION}.gz
          mv mihomo-linux-amd64-${MIHOMO_VERSION} mihomo
          chmod +x mihomo
          ./mihomo -v

      # 4️⃣ 仅转换变动的 rules
      - name: Convert changed YAML rules to MRS
        run: |
          set -e
          mkdir -p rules_mrs

          # 只处理本次提交中变动的 rules
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- rules/*.yaml || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "🟢 No rule changes detected"
            exit 0
          fi

          for file in $CHANGED_FILES; do
            name=$(basename "$file" .yaml)
            out="rules_mrs/${name}.mrs"
            echo "🔄 $file -> $out"
            ./mihomo convert-ruleset domain yaml "$file" "$out"
          done

          echo "✅ Conversion finished"
          ls -lh rules_mrs

      # 5️⃣ 提交并推送结果
      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules_mrs

          if git diff --staged --quiet; then
            echo "📝 No changes to commit"
            exit 0
          fi

          git commit -m "chore: convert YAML rules to MRS"
          git push
