name: Convert YAML rules to MRS

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "rules/*.yaml"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ 缓存 mihomo 二进制文件
      - name: Cache mihomo binary
        id: cache-mihomo
        uses: actions/cache@v4
        with:
          path: mihomo
          key: mihomo-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            mihomo-${{ runner.os }}-

      # 3️⃣ 下载 mihomo（仅在缓存未命中时）
      - name: Download mihomo
        if: steps.cache-mihomo.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "📦 Fetching latest mihomo version..."
          
          # 使用 GitHub CLI 获取最新版本（更可靠）
          VERSION=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')
          echo "➡️ Version: $VERSION"
          
          # 下载并解压
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz" | \
            gunzip > mihomo
          
          chmod +x mihomo
          ./mihomo -v
        env:
          GH_TOKEN: ${{ github.token }}

      # 4️⃣ 转换 YAML → MRS
      - name: Convert YAML to MRS
        run: |
          set -euo pipefail
          mkdir -p rules_mrs
          
          # 统计文件数量
          file_count=$(find rules -name "*.yaml" | wc -l)
          echo "📁 Found $file_count YAML files to convert"
          
          # 检查 mihomo 是否可执行
          if [ ! -x ./mihomo ]; then
            echo "❌ Error: mihomo binary not found or not executable"
            exit 1
          fi
          
          echo "ℹ️ mihomo version:"
          ./mihomo -v
          echo ""
          
          # 显示 convert-ruleset 帮助信息（用于调试）
          echo "ℹ️ Available convert-ruleset options:"
          ./mihomo convert-ruleset --help 2>&1 | head -n 20 || echo "  (help not available)"
          echo ""
          
          # 转换文件
          success_count=0
          fail_count=0
          failed_files=()
          
          for file in rules/*.yaml; do
            if [ ! -f "$file" ]; then
              echo "⚠️ No YAML files found in rules/ directory"
              continue
            fi
            
            name=$(basename "$file" .yaml)
            out="rules_mrs/${name}.mrs"
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 Converting: $name"
            echo "  Input:  $file"
            echo "  Output: $out"
            
            # 显示 YAML 文件的前几行用于调试
            echo "  Preview (first 10 lines):"
            head -n 10 "$file" | sed 's/^/    /'
            echo ""
            
            # 尝试多种转换方式
            converted=false
            
            # 方法 1: domain yaml (标准 Clash 规则集)
            echo "  🔸 Trying: domain yaml format"
            if ./mihomo convert-ruleset domain yaml "$file" "$out" 2>&1 | tee /tmp/convert_log_${name}_1.txt; then
              if [ -f "$out" ] && [ -s "$out" ]; then
                echo "    ✅ Success with domain yaml"
                converted=true
              fi
            fi
            
            # 方法 2: domain text (纯文本域名列表)
            if [ "$converted" = false ]; then
              echo "  🔸 Trying: domain text format"
              if ./mihomo convert-ruleset domain text "$file" "$out" 2>&1 | tee /tmp/convert_log_${name}_2.txt; then
                if [ -f "$out" ] && [ -s "$out" ]; then
                  echo "    ✅ Success with domain text"
                  converted=true
                fi
              fi
            fi
            
            # 方法 3: domain mrs (MRS 输入格式)
            if [ "$converted" = false ]; then
              echo "  🔸 Trying: domain mrs format"
              if ./mihomo convert-ruleset domain mrs "$file" "$out" 2>&1 | tee /tmp/convert_log_${name}_3.txt; then
                if [ -f "$out" ] && [ -s "$out" ]; then
                  echo "    ✅ Success with domain mrs"
                  converted=true
                fi
              fi
            fi
            
            # 方法 4: classical yaml (经典规则集格式)
            if [ "$converted" = false ]; then
              echo "  🔸 Trying: classical yaml format"
              if ./mihomo convert-ruleset classical yaml "$file" "$out" 2>&1 | tee /tmp/convert_log_${name}_4.txt; then
                if [ -f "$out" ] && [ -s "$out" ]; then
                  echo "    ✅ Success with classical yaml"
                  converted=true
                fi
              fi
            fi
            
            # 检查结果
            if [ "$converted" = true ]; then
              ((success_count++))
              size=$(du -h "$out" | cut -f1)
              lines=$(wc -l < "$out")
              echo "  ✅ Final result: $size, $lines lines"
            else
              ((fail_count++))
              failed_files+=("$name")
              echo "  ❌ All conversion methods failed"
              echo "  Error logs:"
              for i in 1 2 3 4; do
                if [ -f "/tmp/convert_log_${name}_${i}.txt" ]; then
                  echo "    --- Method $i ---"
                  tail -n 5 /tmp/convert_log_${name}_${i}.txt | sed 's/^/    /'
                fi
              done
            fi
            echo ""
          done
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Conversion Summary:"
          echo "  - Total: $file_count"
          echo "  - Success: $success_count"
          echo "  - Failed: $fail_count"
          
          if [ $fail_count -gt 0 ]; then
            echo ""
            echo "❌ Failed files:"
            for failed in "${failed_files[@]}"; do
              echo "  - $failed"
            done
            exit 1
          fi
          
          echo ""
          echo "📂 Generated files:"
          ls -lh rules_mrs/

      # 5️⃣ 提交结果
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add rules_mrs
          
          if git diff --staged --quiet; then
            echo "📝 No changes to commit"
            exit 0
          fi
          
          # 生成更详细的提交信息
          changed_files=$(git diff --staged --name-only rules_mrs | wc -l)
          git commit -m "chore: convert YAML rules to MRS" \
                     -m "" \
                     -m "- Updated $changed_files MRS file(s)" \
                     -m "- Auto-generated by GitHub Actions"
          
          git push
          echo "✅ Changes pushed successfully"
