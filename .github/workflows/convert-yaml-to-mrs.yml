name: Convert YAML rules to MRS

permissions:
  contents: write

concurrency:
  group: rules-convert
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "rules/*.yaml"

env:
  MIHOMO_VERSION: v1.19.19

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Cache mihomo binary
        id: cache-mihomo
        uses: actions/cache@v4
        with:
          path: mihomo
          key: mihomo-${{ runner.os }}-${{ env.MIHOMO_VERSION }}

      - name: Download mihomo
        if: steps.cache-mihomo.outputs.cache-hit != 'true'
        run: |
          set -e
          wget -q https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz
          gunzip mihomo-linux-amd64-${MIHOMO_VERSION}.gz
          mv mihomo-linux-amd64-${MIHOMO_VERSION} mihomo
          chmod +x mihomo

      # ⭐ 核心：增量 + 自愈
      - name: Sync rules_mrs with rules (self-healing)
        run: |
          set -e
          mkdir -p rules_mrs

          # 1️⃣ 处理本次变更（A/M/D/R）
          git diff --name-status HEAD~1 HEAD -- rules/*.yaml > /tmp/changes.txt || true

          if [ -s /tmp/changes.txt ]; then
            while read -r status src dst; do
              case "$status" in
                A|M)
                  ./mihomo convert-ruleset domain yaml "$src" "rules_mrs/$(basename "$src" .yaml).mrs"
                  ;;
                D)
                  rm -f "rules_mrs/$(basename "$src" .yaml).mrs"
                  ;;
                R*)
                  rm -f "rules_mrs/$(basename "$src" .yaml).mrs"
                  ./mihomo convert-ruleset domain yaml "$dst" "rules_mrs/$(basename "$dst" .yaml).mrs"
                  ;;
              esac
            done < /tmp/changes.txt
          fi

          # 2️⃣ 自愈检查：rules 和 rules_mrs 是否一一对应
          NEED_FULL_SYNC=0
          for y in rules/*.yaml; do
            m="rules_mrs/$(basename "$y" .yaml).mrs"
            if [ ! -f "$m" ]; then
              echo "⚠️ Missing $m"
              NEED_FULL_SYNC=1
            fi
          done

          if [ "$NEED_FULL_SYNC" -eq 1 ]; then
            echo "🔁 Full resync triggered"
            rm -f rules_mrs/*.mrs
            for y in rules/*.yaml; do
              ./mihomo convert-ruleset domain yaml "$y" "rules_mrs/$(basename "$y" .yaml).mrs"
            done
          fi

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules_mrs

          if git diff --staged --quiet; then
            echo "📝 No changes to commit"
            exit 0
          fi

          git commit -m "chore: sync rules_mrs"
          git pull --rebase origin main
          git push origin main
