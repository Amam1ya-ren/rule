name: Convert YAML rules to MRS

permissions:
  contents: write

concurrency:
  group: rules-convert
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - "rules/*.yaml"
    branches:
      - main

env:
  MIHOMO_VERSION: v1.19.18

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Cache mihomo binary
        id: cache-mihomo
        uses: actions/cache@v4
        with:
          path: mihomo
          key: mihomo-${{ runner.os }}-${{ env.MIHOMO_VERSION }}

      - name: Download mihomo
        if: steps.cache-mihomo.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz
          gunzip mihomo-linux-amd64-${MIHOMO_VERSION}.gz
          mv mihomo-linux-amd64-${MIHOMO_VERSION} mihomo
          chmod +x mihomo

      - name: Convert all YAML rules to MRS
        run: |
          set -e
          mkdir -p rules_mrs
          
          echo "🔄 Converting all YAML files to MRS..."
          
          # 直接转换所有 YAML 文件（简单可靠）
          CONVERTED=0
          for yaml_file in rules/*.yaml; do
            [ -f "$yaml_file" ] || continue
            
            mrs_file="rules_mrs/$(basename "$yaml_file" .yaml).mrs"
            echo "  → Converting: $(basename "$yaml_file")"
            
            ./mihomo convert-ruleset domain yaml "$yaml_file" "$mrs_file"
            CONVERTED=$((CONVERTED + 1))
          done
          
          # 清理孤立的 MRS 文件（对应的 YAML 已删除）
          for mrs_file in rules_mrs/*.mrs; do
            [ -f "$mrs_file" ] || continue
            yaml_file="rules/$(basename "$mrs_file" .mrs).yaml"
            if [ ! -f "$yaml_file" ]; then
              echo "  🗑️  Removing orphaned: $(basename "$mrs_file")"
              rm -f "$mrs_file"
            fi
          done
          
          echo "✅ Converted $CONVERTED YAML files"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add rules_mrs/
          
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi
          
          echo "📊 Changes:"
          git diff --staged --stat
          
          git commit -m "chore: update MRS files [skip ci]"
          
          # 重试推送
          for i in {1..3}; do
            if git push; then
              echo "✅ Pushed successfully"
              exit 0
            fi
            echo "⚠️  Retry $i/3..."
            git pull --rebase
            sleep 2
          done
          
          echo "❌ Push failed"
          exit 1
