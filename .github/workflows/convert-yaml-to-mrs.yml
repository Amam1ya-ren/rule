name: Convert YAML rules to MRS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "rules/*.yaml"
      - ".github/workflows/convert-yaml-to-mrs.yml"

permissions:
  contents: write

concurrency:
  group: rules-convert-${{ github.ref }}
  cancel-in-progress: true

env:
  MIHOMO_VERSION: v1.19.18
  MIHOMO_BIN: .tools/mihomo

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache mihomo binary
        id: cache-mihomo
        uses: actions/cache@v4
        with:
          path: ${{ env.MIHOMO_BIN }}
          key: mihomo-${{ runner.os }}-${{ runner.arch }}-${{ env.MIHOMO_VERSION }}

      - name: Download mihomo
        if: steps.cache-mihomo.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$MIHOMO_BIN")"
          curl -fsSL --retry 3 \
            -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gzip -dc mihomo.gz > "$MIHOMO_BIN"
          chmod +x "$MIHOMO_BIN"

      - name: Convert YAML rules to MRS
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          yaml_files=(rules/*.yaml)
          if (( ${#yaml_files[@]} == 0 )); then
            echo "No YAML rule files found in rules/."
            exit 1
          fi

          rm -rf rules_mrs
          mkdir -p rules_mrs

          for yaml_file in "${yaml_files[@]}"; do
            mrs_file="rules_mrs/$(basename "$yaml_file" .yaml).mrs"
            echo "Converting $yaml_file -> $mrs_file"
            "$MIHOMO_BIN" convert-ruleset domain yaml "$yaml_file" "$mrs_file"
          done

          echo "Converted ${#yaml_files[@]} YAML rule file(s)."

      - name: Commit generated MRS files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A rules_mrs/

          if git diff --cached --quiet; then
            echo "No generated MRS changes to commit."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "chore: update MRS files [skip ci]"
          git push
