name: Convert YAML rules to MRS

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "rules/*.yaml"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ 缓存 mihomo 二进制文件
      - name: Cache mihomo binary
        id: cache-mihomo
        uses: actions/cache@v4
        with:
          path: mihomo
          key: mihomo-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            mihomo-${{ runner.os }}-

      # 3️⃣ 下载 mihomo（仅在缓存未命中时）
      - name: Download mihomo
        if: steps.cache-mihomo.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "📦 Fetching latest mihomo version..."
          
          # 使用 GitHub CLI 获取最新版本（更可靠）
          VERSION=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')
          echo "➡️ Version: $VERSION"
          
          # 下载并解压
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz" | \
            gunzip > mihomo
          
          chmod +x mihomo
          ./mihomo -v
        env:
          GH_TOKEN: ${{ github.token }}

      # 4️⃣ 转换 YAML → MRS
      - name: Convert YAML to MRS
        run: |
          set -euo pipefail
          mkdir -p rules_mrs
          
          # 统计文件数量
          file_count=$(find rules -name "*.yaml" | wc -l)
          echo "📁 Found $file_count YAML files to convert"
          
          # 转换文件
          success_count=0
          fail_count=0
          
          for file in rules/*.yaml; do
            if [ ! -f "$file" ]; then
              echo "⚠️ No YAML files found in rules/ directory"
              continue
            fi
            
            name=$(basename "$file" .yaml)
            out="rules_mrs/${name}.mrs"
            
            echo "🔄 Converting: $name"
            if ./mihomo convert-ruleset domain yaml "$file" "$out"; then
              ((success_count++))
              size=$(du -h "$out" | cut -f1)
              echo "  ✅ Success ($size)"
            else
              ((fail_count++))
              echo "  ❌ Failed"
            fi
          done
          
          echo ""
          echo "📊 Conversion Summary:"
          echo "  - Total: $file_count"
          echo "  - Success: $success_count"
          echo "  - Failed: $fail_count"
          
          if [ $fail_count -gt 0 ]; then
            exit 1
          fi
          
          ls -lh rules_mrs/

      # 5️⃣ 提交结果
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add rules_mrs
          
          if git diff --staged --quiet; then
            echo "📝 No changes to commit"
            exit 0
          fi
          
          # 生成更详细的提交信息
          changed_files=$(git diff --staged --name-only rules_mrs | wc -l)
          git commit -m "chore: convert YAML rules to MRS" \
                     -m "" \
                     -m "- Updated $changed_files MRS file(s)" \
                     -m "- Auto-generated by GitHub Actions"
          
          git push
          echo "✅ Changes pushed successfully"
